server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Market quotes — proxy direto para AwesomeAPI (backend não alcança)
    location = /api/v1/market/quotes {
        set $pairs $arg_pairs;
        if ($pairs = "") {
            set $pairs "USD-BRL,EUR-BRL";
        }
        rewrite ^ /json/last/$pairs break;
        proxy_pass https://economia.awesomeapi.com.br;
        proxy_set_header Host economia.awesomeapi.com.br;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Market history — proxy direto para AwesomeAPI
    location ~ ^/api/v1/market/history/([^/]+)$ {
        set $moeda $1;
        set $dias $arg_dias;
        if ($dias = "") {
            set $dias "30";
        }
        rewrite ^ /json/daily/$moeda/$dias break;
        proxy_pass https://economia.awesomeapi.com.br;
        proxy_set_header Host economia.awesomeapi.com.br;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Proxy API requests to BFF (routes to CRM + E-commerce)
    location /api/ {
        proxy_pass http://crm-bff:9000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html (always fresh for new deploys)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
