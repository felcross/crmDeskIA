name: E-commerce CI/CD

on:
  push:
    branches: [main]
    paths:
      - "services/ecommerce/**"
      - "docker-compose.yml"
      - ".github/workflows/ecommerce.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check services/ecommerce/

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/crmDeskIA
            git pull
            docker compose -f docker-compose.yml build ecommerce-backend
            docker compose -f docker-compose.yml up -d ecommerce-backend
