services:
  # --- BFF (camada pública) ---
  bff:
    build:
      context: ./services/bff
      dockerfile: Dockerfile
    container_name: crm-bff
    restart: unless-stopped
    ports:
      - "9000:9000"
    depends_on:
      crm-backend:
        condition: service_healthy
      ecommerce-backend:
        condition: service_healthy
    networks:
      - proxy_network

  # --- CRM/ERP (existente, porta interna) ---
  crm-backend:
    build:
      context: ./services/crm
      dockerfile: Dockerfile
    container_name: crm-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:123@crm-postgres:5432/postgres
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_ORIGIN=https://crm.felbatista.tech
      - APP_ENV=production
    depends_on:
      crm-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - crm_cache:/app/.cache
    networks:
      - proxy_network

  # --- E-commerce (novo, porta interna) ---
  ecommerce-backend:
    build:
      context: ./services/ecommerce
      dockerfile: Dockerfile
    container_name: ecommerce-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:123@ecom-postgres:5432/ecommerce
    depends_on:
      ecom-postgres:
        condition: service_healthy
    networks:
      - proxy_network

  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    restart: unless-stopped
    ports:
      - "8502:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - proxy_network

  # --- Bancos ---
  crm-postgres:
    image: postgres:16-alpine
    container_name: crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: postgres
    volumes:
      - crm_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_network

  ecom-postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: ecommerce
    volumes:
      - ecom_postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_network

  redis:
    image: redis:7-alpine
    container_name: crm-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy_network

volumes:
  crm_cache:
  crm_postgres_data:
  ecom_postgres_data:
  redis_data:

networks:
  proxy_network:
    external: true
    name: rede_vps
